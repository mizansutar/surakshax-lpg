
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SurakshaX | Sensor History</title>

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;

            background:
                radial-gradient(
                    circle at 10% 0%,
                    rgba(67,165,255,.10),
                    transparent 28%
                ),
                radial-gradient(
                    circle at 90% 30%,
                    rgba(37,211,102,.07),
                    transparent 25%
                ),
                #07111f;

            color: #eef6ff;

            min-height: 100vh;
        }


        /* =========================
           NAVBAR
        ========================= */

        .navbar {

            height: 72px;

            padding: 0 5%;

            display: flex;

            align-items: center;

            justify-content: space-between;

            border-bottom:
                1px solid
                rgba(255,255,255,.08);

            background:
                rgba(7,17,31,.88);

            backdrop-filter:
                blur(15px);

            position: sticky;

            top: 0;

            z-index: 100;
        }


        .logo {

            display: flex;

            align-items: center;

            gap: 10px;

            font-size: 21px;

            font-weight: 800;
        }


        .logo-icon {

            width: 38px;

            height: 38px;

            border-radius: 12px;

            display: flex;

            align-items: center;

            justify-content: center;

            background:
                linear-gradient(
                    135deg,
                    #25d366,
                    #43a5ff
                );
        }


        .nav-right {

            display: flex;

            align-items: center;

            gap: 10px;
        }


        .nav-link {

            color: #91a4b8;

            text-decoration: none;

            padding: 10px 14px;

            border-radius: 10px;

            font-size: 14px;
        }


        .nav-link:hover,
        .nav-link.active {

            background:
                rgba(255,255,255,.06);

            color: white;
        }


        .logout-btn {

            border: none;

            background:
                rgba(255,77,94,.10);

            color: #ff7785;

            padding: 10px 14px;

            border-radius: 10px;

            cursor: pointer;

            font-weight: 600;
        }


        /* =========================
           MAIN
        ========================= */

        .container {

            width: min(1200px, 92%);

            margin: auto;

            padding: 38px 0 60px;
        }


        .page-header {

            display: flex;

            justify-content: space-between;

            align-items: flex-end;

            gap: 20px;

            margin-bottom: 28px;
        }


        .page-header h1 {

            font-size:
                clamp(28px, 5vw, 44px);

            margin-bottom: 8px;
        }


        .page-header p {

            color: #91a4b8;

            line-height: 1.5;
        }


        /* =========================
           HISTORY CARD
        ========================= */

        .history-card {

            background:
                rgba(13,27,42,.82);

            border:
                1px solid
                rgba(255,255,255,.08);

            border-radius: 20px;

            padding: 20px;

            box-shadow:
                0 18px 50px
                rgba(0,0,0,.20);
        }


        .history-top {

            display: flex;

            justify-content: space-between;

            align-items: center;

            margin-bottom: 18px;

            gap: 15px;
        }


        .history-top h2 {

            font-size: 19px;
        }


        .record-count {

            color: #91a4b8;

            font-size: 13px;
        }


        /* =========================
           TABLE
        ========================= */

        .table-wrapper {

            width: 100%;

            overflow-x: auto;
        }


        table {

            width: 100%;

            border-collapse: collapse;

            min-width: 850px;
        }


        thead {

            background:
                rgba(255,255,255,.035);
        }


        th {

            padding: 14px 12px;

            text-align: left;

            color: #91a4b8;

            font-size: 12px;

            font-weight: 700;

            white-space: nowrap;
        }


        td {

            padding: 14px 12px;

            border-top:
                1px solid
                rgba(255,255,255,.06);

            font-size: 13px;

            white-space: nowrap;
        }


        tbody tr {

            transition: .2s;
        }


        tbody tr:hover {

            background:
                rgba(255,255,255,.025);
        }


        /* =========================
           BADGES
        ========================= */

        .badge {

            display: inline-block;

            padding: 6px 10px;

            border-radius: 8px;

            font-size: 11px;

            font-weight: 800;
        }


        .normal {

            background:
                rgba(37,211,102,.10);

            color: #65e994;
        }


        .danger {

            background:
                rgba(255,77,94,.12);

            color: #ff7885;
        }


        .neutral {

            background:
                rgba(255,255,255,.06);

            color: #91a4b8;
        }


        /* =========================
           LOADING
        ========================= */

        .loading {

            text-align: center;

            padding: 45px;

            color: #91a4b8;
        }


        .spinner {

            width: 32px;

            height: 32px;

            border:
                3px solid
                rgba(255,255,255,.08);

            border-top-color:
                #43a5ff;

            border-radius: 50%;

            animation:
                spin .8s linear infinite;

            margin:
                0 auto 15px;
        }


        @keyframes spin {

            to {
                transform: rotate(360deg);
            }

        }


        /* =========================
           EMPTY
        ========================= */

        .empty {

            text-align: center;

            padding: 50px 20px;

            color: #71869b;
        }


        .empty-icon {

            font-size: 42px;

            margin-bottom: 12px;
        }


        .empty h3 {

            color: #c4d0dc;

            margin-bottom: 7px;
        }


        /* =========================
           FOOTER
        ========================= */

        .footer {

            text-align: center;

            margin-top: 30px;

            color: #5f7387;

            font-size: 12px;
        }


        /* =========================
           MOBILE
        ========================= */

        @media(max-width:600px) {

            .navbar {

                padding:
                    0 4%;
            }


            .nav-link {

                display: none;
            }


            .container {

                width: 92%;
            }


            .history-card {

                padding: 14px;
            }


            .page-header {

                align-items:
                    flex-start;

                flex-direction:
                    column;
            }

        }

    </style>

</head>


<body>


<!-- =====================================================
     NAVBAR
===================================================== -->

<nav class="navbar">

    <div class="logo">

        <div class="logo-icon">
            🛡️
        </div>

        SurakshaX

    </div>


    <div class="nav-right">

        <a
            href="dashboard.html"
            class="nav-link">

            Dashboard

        </a>


        <a
            href="history.html"
            class="nav-link active">

            History

        </a>


        <button
            class="logout-btn"
            onclick="logout()">

            Logout

        </button>

    </div>

</nav>



<!-- =====================================================
     MAIN
===================================================== -->

<main class="container">


    <div class="page-header">

        <div>

            <h1>
                Sensor History
            </h1>

            <p>
                Historical readings recorded by your Smart LPG Safety System.
            </p>

        </div>

    </div>



    <!-- =================================================
         HISTORY CARD
    ================================================== -->

    <div class="history-card">


        <div class="history-top">

            <h2>
                Recent Sensor Records
            </h2>

            <div
                id="recordCount"
                class="record-count">

                Loading...

            </div>

        </div>


        <div class="table-wrapper">

            <table>


                <thead>

                    <tr>

                        <th>
                            TIME
                        </th>

                        <th>
                            MQ-3
                        </th>

                        <th>
                            TEMPERATURE
                        </th>

                        <th>
                            HUMIDITY
                        </th>

                        <th>
                            GAS
                        </th>

                        <th>
                            FLAME
                        </th>

                        <th>
                            ALARM
                        </th>

                        <th>
                            BUZZER
                        </th>

                    </tr>

                </thead>


                <tbody id="historyBody">

                    <tr>

                        <td
                            colspan="8"
                            class="loading">

                            <div class="spinner"></div>

                            Loading sensor history...

                        </td>

                    </tr>

                </tbody>


            </table>

        </div>

    </div>



    <div class="footer">

        SurakshaX Smart LPG Safety System
        • Firebase Realtime Monitoring

    </div>


</main>



<!-- =====================================================
     FIREBASE
===================================================== -->

<script>


// =====================================================
// FIREBASE CONFIGURATION
// =====================================================

const firebaseConfig = {

    apiKey:
        "AIzaSyCVMffiq5d-3Cfu20TNCF2-tW1IIS7qv6k",

    authDomain:
        "testing-752a4.firebaseapp.com",

    databaseURL:
        "https://testing-752a4-default-rtdb.asia-southeast1.firebasedatabase.app",

    projectId:
        "testing-752a4",

    storageBucket:
        "testing-752a4.firebasestorage.app",

    messagingSenderId:
        "1021193926515",

    appId:
        "1:1021193926515:web:0b223572778b4aa778b706",

    measurementId:
        "G-LLS4FKKLK5"

};


// =====================================================
// INITIALIZE FIREBASE
// =====================================================

firebase.initializeApp(
    firebaseConfig
);


const auth =
    firebase.auth();


const database =
    firebase.database();


// =====================================================
// LOGOUT
// =====================================================

function logout() {

    auth.signOut()
        .then(function() {

            window.location.href =
                "login.html";

        });

}


// =====================================================
// AUTH CHECK
// =====================================================

auth.onAuthStateChanged(
    function(user) {

        if (!user) {

            window.location.href =
                "login.html";

            return;

        }


        loadHistory();

    }
);


// =====================================================
// LOAD HISTORY
// =====================================================

function loadHistory() {


    const historyRef =
        database
            .ref("sensorHistory")
            .limitToLast(50);


    historyRef.on(
        "value",
        function(snapshot) {


            const data =
                snapshot.val();


            const historyBody =
                document.getElementById(
                    "historyBody"
                );


            const recordCount =
                document.getElementById(
                    "recordCount"
                );


            // =========================================
            // NO DATA
            // =========================================

            if (!data) {

                historyBody.innerHTML = `

                    <tr>

                        <td
                            colspan="8"
                            class="empty">

                            <div class="empty-icon">
                                📊
                            </div>

                            <h3>
                                No History Yet
                            </h3>

                            <p>
                                Sensor records will appear here
                                once your ESP32 starts uploading data.
                            </p>

                        </td>

                    </tr>

                `;


                recordCount.textContent =
                    "0 records";


                return;

            }


            // =========================================
            // CONVERT OBJECT TO ARRAY
            // =========================================

            const records =
                Object.entries(data);


            // =========================================
            // SORT NEWEST FIRST
            // =========================================

            records.sort(
                function(a,b) {

                    return Number(b[0])
                         - Number(a[0]);

                }
            );


            // =========================================
            // COUNT
            // =========================================

            recordCount.textContent =
                records.length +
                (
                    records.length === 1
                        ? " record"
                        : " records"
                );


            // =========================================
            // CREATE TABLE
            // =========================================

            historyBody.innerHTML = "";


            records.forEach(
                function(record) {


                    const timestamp =
                        record[0];

                    const data =
                        record[1];


                    // =================================
                    // TIME
                    // =================================

                    const time =
                        new Date(
                            Number(timestamp)
                        );


                    const formattedTime =
                        time.toLocaleString();


                    // =================================
                    // VALUES
                    // =================================

                    const gas =
                        data.mq3 ??
                        "--";


                    const temp =
                        data.temperature !==
                        undefined
                            ? Number(
                                data.temperature
                            ).toFixed(1) +
                              " °C"
                            : "--";


                    const humidity =
                        data.humidity !==
                        undefined
                            ? Number(
                                data.humidity
                            ).toFixed(1) +
                              " %"
                            : "--";


                    const gasDetected =
                        data.gasDetected === true;


                    const flameDetected =
                        data.flameDetected === true;


                    const alarm =
                        data.alarm === true;


                    const buzzer =
                        data.buzzer === true;


                    // =================================
                    // TABLE ROW
                    // =================================

                    const row =
                        document.createElement(
                            "tr"
                        );


                    row.innerHTML = `

                        <td>
                            ${formattedTime}
                        </td>


                        <td>
                            ${gas}
                        </td>


                        <td>
                            ${temp}
                        </td>


                        <td>
                            ${humidity}
                        </td>


                        <td>

                            <span class="
                                badge
                                ${gasDetected
                                    ? "danger"
                                    : "normal"}
                            ">

                                ${gasDetected
                                    ? "DETECTED"
                                    : "NORMAL"}

                            </span>

                        </td>


                        <td>

                            <span class="
                                badge
                                ${flameDetected
                                    ? "danger"
                                    : "normal"}
                            ">

                                ${flameDetected
                                    ? "DETECTED"
                                    : "NORMAL"}

                            </span>

                        </td>


                        <td>

                            <span class="
                                badge
                                ${alarm
                                    ? "danger"
                                    : "normal"}
                            ">

                                ${alarm
                                    ? "ACTIVE"
                                    : "SAFE"}

                            </span>

                        </td>


                        <td>

                            <span class="
                                badge
                                ${buzzer
                                    ? "danger"
                                    : "neutral"}
                            ">

                                ${buzzer
                                    ? "ON"
                                    : "OFF"}

                            </span>

                        </td>

                    `;


                    historyBody.appendChild(
                        row
                    );

                }
            );

        },


        function(error) {

            console.error(
                "History Firebase Error:",
                error
            );


            document
                .getElementById(
                    "historyBody"
                )
                .innerHTML = `

                    <tr>

                        <td
                            colspan="8"
                            class="empty">

                            <div class="empty-icon">
                                ⚠️
                            </div>

                            <h3>
                                Unable to Load History
                            </h3>

                            <p>
                                Check your Firebase connection
                                and database rules.
                            </p>

                        </td>

                    </tr>

                `;

        }
    );

}

</script>


</body>
</html>
